[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-life-copilot-api"
version = "0.1.0"
description = "LocalLife Copilot API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.16.2",
  "argon2-cffi==25.1.0",
  "asyncmy==0.2.11",
  "celery[redis]==5.5.3",
  "fastapi==0.116.1",
  "langgraph==1.2.9",
  "openpyxl==3.1.5",
  "opensearch-py==3.0.0",
  "pandas==2.3.1",
  "pydantic-settings==2.10.1",
  "pypdf==5.7.0",
  "PyJWT==2.10.1",
  "pymysql[rsa]==1.1.1",
  "python-docx==1.2.0",
  "python-multipart==0.0.20",
  "redis==5.2.1",
  "sqlalchemy==2.0.41",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
model = [
  "torch>=2.0.0",
  "transformers>=4.30.0",
  "sentence-transformers>=2.2.0",
]
training = [
  "scikit-learn>=1.3.0",
  "accelerate>=1.0.0",
  "datasets>=3.0.0",
  "peft>=0.14.0",
]
dev = [
  "httpx==0.28.1",
  "openai==2.46.0",
  "pyyaml==6.0.2",
  "pytest==8.4.1",
  "pytest-asyncio==1.0.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.2",
]
performance = [
  "locust==2.46.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_lines = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
exclude = ["demo_data/**", "training/**"]

[tool.ruff.lint.per-file-ignores]
# ETL 类型别名由对应任务负责人迁移；Python 3.13 运行时升级不改动其业务代码。
"app/etl/models.py" = ["UP040"]
"app/etl/splitters.py" = ["UP040"]
# 调试脚本：延迟导入、行长度不做强制约束。
# 训练脚本：依赖检查函数中的 import 仅用于可用性验证，非实际使用。
"training/*.py" = ["F401", "E501"]

[tool.ruff.format]
# 保持任务边界，不在运行时升级提交中格式化其他负责人维护的 ETL 模型。
exclude = ["app/etl/models.py", "demo_data/**"]
