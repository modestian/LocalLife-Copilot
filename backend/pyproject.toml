[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-life-copilot-api"
version = "0.1.0"
description = "LocalLife Copilot API"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.16.2",
  "asyncmy==0.2.10",
  "celery[redis]==5.5.3",
  "fastapi==0.116.1",
  "openpyxl==3.1.5",
  "opensearch-py==3.0.0",
  "pandas==2.3.1",
  "pydantic-settings==2.10.1",
  "pypdf==5.7.0",
  "pymysql[rsa]==1.1.1",
  "python-docx==1.2.0",
  "redis==5.2.1",
  "sqlalchemy==2.0.41",
  "torch>=2.2",
  "transformers>=4.44",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pyyaml==6.0.2",
  "pytest==8.4.1",
  "pytest-asyncio==1.0.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_lines = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
