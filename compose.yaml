name: local-life-copilot

x-backend-args: &backend-args
  args:
    PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    TORCH_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
services:
  mysql:
    image: public.ecr.aws/docker/library/mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-local_life}
      MYSQL_USER: ${MYSQL_USER:-local_life}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_life_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_life_root_dev}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [backend]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    image: public.ecr.aws/docker/library/redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  opensearch:
    image: public.ecr.aws/opensearchproject/opensearch:3.7.0
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks: [backend]
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --silent --fail 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  model-gateway:
    build:
      context: ./backend
      <<: *backend-args
    command: ["uvicorn", "app.model_gateway:app", "--host", "0.0.0.0", "--port", "8001"]
    expose: ["8001"]
    environment:
      SENTIMENT_MODEL: ${SENTIMENT_MODEL:-/models/sentiment}
      SENTIMENT_MODEL_REVISION: ${SENTIMENT_MODEL_REVISION:-}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-small-zh-v1.5}
      SENTENCE_TRANSFORMERS_HOME: /models/embedding-cache
      CLASSIFIER_MODEL_NAME: ${CLASSIFIER_MODEL_NAME:-/app/training/output/final_model}
      GENERATION_MODEL_NAME: ${GENERATION_MODEL_NAME:-Qwen/Qwen2.5-0.5B-Instruct}
    volumes:
      - ./backend/training/output/final_model:/models/sentiment:ro
    networks: [backend]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  migrate:
    build:
      context: ./backend
      <<: *backend-args
    command: ["alembic", "upgrade", "head"]
    environment: &api-environment
      APP_ENVIRONMENT: development
      MYSQL_DATABASE: ${MYSQL_DATABASE:-local_life}
      MYSQL_USER: ${MYSQL_USER:-local_life}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_life_dev}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_URL: redis://redis:6379/0
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-local-life-chunks}
      OPENSEARCH_INDEX_VERSION: ${OPENSEARCH_INDEX_VERSION:-1}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-512}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-local-deterministic-v1}
      KNOWLEDGE_DATA_ROOT: ${KNOWLEDGE_DATA_ROOT:-/data/knowledge}
      TRAINING_ARTIFACT_ROOT: ${TRAINING_ARTIFACT_ROOT:-/data/training/artifacts}
      MAX_INGESTION_SOURCE_BYTES: ${MAX_INGESTION_SOURCE_BYTES:-20971520}
      MODEL_GATEWAY_HEALTH_URL: ${MODEL_GATEWAY_HEALTH_URL:-http://model-gateway:8001/health/live}
      MODEL_GATEWAY_EMBEDDING_URL: ${MODEL_GATEWAY_EMBEDDING_URL:-http://model-gateway:8001/v1/embeddings}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-only-change-this-jwt-secret-key}
      JWT_ISSUER: ${JWT_ISSUER:-local-life-copilot}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-local-life-copilot-api}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-30}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
    networks: [backend]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  init:
    build:
      context: ./backend
      <<: *backend-args
    command: ["python", "-m", "app.init_runtime"]
    environment: *api-environment
    networks: [backend]
    depends_on:
      migrate:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  seed:
    build:
      context: ./backend
      <<: *backend-args
    command: ["python", "-m", "app.cli.seed_demo_data"]
    environment:
      <<: *api-environment
      DEMO_SEED_PASSWORD: ${DEMO_SEED_PASSWORD:-local-life-demo-2026}
    networks: [backend]
    depends_on:
      init:
        condition: service_completed_successfully
      model-gateway:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  prepare-knowledge-data:
    build:
      context: ./backend
      <<: *backend-args
    command: ["sh", "-c", "mkdir -p /data/knowledge && chown -R app:app /data/knowledge"]
    user: "0:0"
    volumes:
      - knowledge-data:/data/knowledge
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  prepare-training-data:
    build:
      context: ./backend
      <<: *backend-args
    command: ["sh", "-c", "mkdir -p /data/training/artifacts && chown -R app:app /data/training"]
    user: "0:0"
    volumes:
      - training-artifacts:/data/training
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  api:
    build:
      context: ./backend
      <<: *backend-args
    environment: *api-environment
    networks: [edge, backend]
    volumes:
      - knowledge-data:/data/knowledge
    depends_on: &application-dependencies
      migrate:
        condition: service_completed_successfully
      init:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      prepare-knowledge-data:
        condition: service_completed_successfully
      prepare-training-data:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      model-gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  worker:
    build:
      context: ./backend
      <<: *backend-args
    command:
      [
        "celery",
        "--app",
        "app.worker:celery_app",
        "worker",
        "--loglevel=INFO",
        "--hostname=worker@%h",
        "--concurrency=1",
        "--beat",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    environment: *api-environment
    networks: [backend]
    volumes:
      - knowledge-data:/data/knowledge:ro
      - training-artifacts:/data/training
    depends_on: *application-dependencies
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery --app app.worker:celery_app inspect ping --destination worker@$${HOSTNAME} --timeout 5 | grep -q pong",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  nginx:
    build:
      context: ./deploy/nginx
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]

networks:
  edge:
  backend:
    internal: true

volumes:
  mysql-data:
  redis-data:
  opensearch-data:
  knowledge-data:
  training-artifacts:
