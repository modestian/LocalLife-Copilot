# Automatically loaded by `docker compose` for local development only.
services:
  nginx:
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
  api:
    build:
      args:
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
        TORCH_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    ports:
      - "127.0.0.1:${API_PORT:-18000}:8000"
  mysql:
    networks: [backend, edge]
    ports:
      - "127.0.0.1:${MYSQL_PORT:-13306}:3306"
  redis:
    networks: [backend, edge]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
  opensearch:
    networks: [backend, edge]
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-19200}:9200"
      - "127.0.0.1:${OPENSEARCH_PERFORMANCE_PORT:-19600}:9600"

  model-gateway:
    build:
      args:
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
        TORCH_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple

  migrate:
