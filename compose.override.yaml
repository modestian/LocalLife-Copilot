# Automatically loaded by `docker compose` for local development only.
x-backend-build-args: &backend-build-args
  PYTHON_IMAGE: public.ecr.aws/docker/library/python:3.13.14-slim
  PIP_INDEX_URL: https://pypi.org/simple
  TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
  EMBEDDING_MODEL_ID: BAAI/bge-small-zh-v1.5

services:
  nginx:
    build:
      args:
        NGINX_IMAGE: public.ecr.aws/docker/library/nginx:1.27-alpine
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
  api:
    build:
      args: *backend-build-args
    ports:
      - "127.0.0.1:${API_PORT:-18000}:8000"
  mysql:
    networks: [backend, edge]
    ports:
      - "127.0.0.1:${MYSQL_PORT:-13306}:3306"
  redis:
    networks: [backend, edge]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
  opensearch:
    networks: [backend, edge]
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-19200}:9200"
      - "127.0.0.1:${OPENSEARCH_PERFORMANCE_PORT:-19600}:9600"

  model-gateway:
    build:
      args: *backend-build-args

  migrate:
    build:
      args: *backend-build-args

  init:
    build:
      args: *backend-build-args

  seed:
    build:
      args: *backend-build-args

  prepare-knowledge-data:
    build:
      args: *backend-build-args

  prepare-training-data:
    build:
      args: *backend-build-args

  worker:
    build:
      args: *backend-build-args

  frontend:
    build:
      args:
        NODE_IMAGE: public.ecr.aws/docker/library/node:22-alpine
        NPM_REGISTRY: https://registry.npmjs.org
