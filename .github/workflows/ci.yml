name: CI

on:
  pull_request:
    branches: [main]
  # GitHub Merge Queue validates its temporary merge commit via this event.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Keep each main push independent while still cancelling stale PR runs.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, test and migration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: local_life_test
          MYSQL_USER: local_life
          MYSQL_PASSWORD: local_life_test
          MYSQL_ROOT_PASSWORD: root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_test --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=15
    env:
      MIGRATION_DATABASE_URL: mysql+pymysql://local_life:local_life_test@127.0.0.1:3306/local_life_test?charset=utf8mb4
      AUTH_MYSQL_INTEGRATION: '1'
      AUTH_MYSQL_DATABASE_URL: mysql+asyncmy://local_life:local_life_test@127.0.0.1:3306/local_life_test?charset=utf8mb4
      ST102_MYSQL_INTEGRATION: '1'
      ST103_MYSQL_INTEGRATION: '1'
      MYSQL_DATABASE: local_life_test
      MYSQL_USER: local_life
      MYSQL_PASSWORD: local_life_test
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.14'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Run migrations against an empty database
        run: alembic upgrade head
      - name: Test and generate coverage report
        run: |
          mkdir -p coverage
          python -m pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage/coverage.xml \
            --cov-report=json:coverage/coverage.json \
            --cov-fail-under=70
      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ github.sha }}
          path: |
            backend/coverage/coverage.xml
            backend/coverage/coverage.json
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  compose:
    name: Compose policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.14'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install Compose policy dependency
        run: python -m pip install pyyaml==6.0.2
      - name: Validate base Compose model
        run: docker compose -f compose.yaml config --quiet
      - name: Validate local development model
        run: docker compose -f compose.yaml -f compose.override.yaml config --quiet
      - name: Enforce healthcheck and port exposure policy
        run: python scripts/verify_compose.py

  images:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./backend
          - image: frontend
            context: ./frontend
          - image: nginx
            context: ./deploy/nginx
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  quality-gate:
    name: Quality gate
    if: always()
    needs: [backend, frontend, compose, images]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
        run: |
          test "$BACKEND_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$COMPOSE_RESULT" = "success"
          test "$IMAGES_RESULT" = "success"
